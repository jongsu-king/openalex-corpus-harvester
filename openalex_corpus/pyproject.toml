[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openalex-corpus"
version = "0.1.2"
description = "Auditable OpenAlex metadata and scientific PDF corpus harvester"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jongsu Lim" }]
keywords = ["openalex", "bibliometrics", "scholarly-metadata", "corpus", "pdf-extraction", "grobid", "docling", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "tenacity>=9,<10",
  "typer>=0.15,<1", "pymupdf>=1.26,<2", "pdfplumber>=0.11,<1",
  "Pillow>=11,<13", "lxml>=5.3,<7", "pandas>=2.2,<4", "pyarrow>=19,<24",
  "psutil>=6,<8", "filelock>=3.17,<4", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
docling = ["docling>=2.60,<3"]
ocr = ["ocrmypdf>=16,<18"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
openalex-corpus = "openalex_corpus.cli:app"

[project.urls]
Repository = "https://github.com/jongsu-king/openalex-corpus-harvester"
Documentation = "https://github.com/jongsu-king/openalex-corpus-harvester/tree/main/openalex_corpus/docs"
Issues = "https://github.com/jongsu-king/openalex-corpus-harvester/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openalex_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real network, explicitly opt in with OPENALEX_RUN_NETWORK=1", "optional: optional parser/service integration"]

[tool.ruff]
target-version = "py311"
line-length = 110
# selfupdate.py is a shared copy kept identical across jongsu-king programs.
extend-exclude = ["src/openalex_corpus/selfupdate.py", "tests/test_selfupdate.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
