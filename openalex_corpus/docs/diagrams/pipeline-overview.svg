<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">OpenAlex Corpus Harvester: module and storage map</title>
<desc id="desc">Pipeline coordinates HTTPX clients and a spawned parser worker. Request receipts, budget reservations, immutable paper artifacts, and SQLite records support checkpoint resume and extraction recovery. Solid arrows show data exchange; dashed arrows show persistence.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1b2936" stroke-width="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79b8ff"/></marker></defs>
<rect width="1680" height="1120" fill="#0d141c"/>
<rect width="1680" height="1120" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text xml:space="preserve" x="40" y="58" font-size="32" fill="#d1d9e0" font-weight="600">openalex_corpus / execution map</text>
<text xml:space="preserve" x="40" y="96" font-size="20" fill="#91a4b7" font-weight="400">HTTP clients  |  asyncio coordinator  |  spawn worker  |  durable state</text>
<rect x="40" y="135" width="1600" height="105" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M40 183 H1640" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="60" y="166" font-size="19" fill="#79b8ff" font-weight="600">cli.py</text>
<text xml:space="preserve" x="62" y="218" font-size="23" fill="#7ee7b4" font-weight="400">$ openalex-corpus harvest ...  -&gt;  SearchSpec.params()  -&gt;  Pipeline.harvest(spec)</text>
<path d="M820 240 L820 292" fill="none" stroke="#79b8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="838" y="276" font-size="16" fill="#91a4b7" font-weight="400">bounded batches</text>
<rect x="40" y="300" width="460" height="400" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M40 348 H500" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="60" y="331" font-size="19" fill="#79b8ff" font-weight="600">api/client.py + download/</text>
<text xml:space="preserve" x="62" y="384" font-size="21" fill="#7ee7b4" font-weight="400">OpenAlexClient.get_page()</text>
<text xml:space="preserve" x="62" y="420" font-size="19" fill="#d1d9e0" font-weight="400">  reserve_metadata(cost)</text>
<text xml:space="preserve" x="62" y="453" font-size="19" fill="#d1d9e0" font-weight="400">  _throttle()</text>
<text xml:space="preserve" x="62" y="486" font-size="19" fill="#d1d9e0" font-weight="400">  GET /works?cursor=...</text>
<text xml:space="preserve" x="62" y="519" font-size="19" fill="#d1d9e0" font-weight="400">  observe_headers(...)</text>
<path d="M62 546 L478 546" fill="none" stroke="#79b8ff" stroke-width="2"/>
<text xml:space="preserve" x="62" y="585" font-size="21" fill="#7ee7b4" font-weight="400">PDFDownloader.download()</text>
<text xml:space="preserve" x="62" y="624" font-size="19" fill="#d1d9e0" font-weight="400">  stream -&gt; validate -&gt; hash</text>
<text xml:space="preserve" x="62" y="660" font-size="19" fill="#d1d9e0" font-weight="400">  .part -&gt; pdf_versions/&lt;sha&gt;</text>
<rect x="540" y="300" width="560" height="400" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M540 348 H1100" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="560" y="331" font-size="19" fill="#79b8ff" font-weight="600">pipeline.py :: Pipeline</text>
<text xml:space="preserve" x="565" y="384" font-size="22" fill="#7ee7b4" font-weight="400">ingest(raw)</text>
<text xml:space="preserve" x="565" y="413" font-size="18" fill="#91a4b7" font-weight="400">  raw payload + normalized metadata</text>
<text xml:space="preserve" x="565" y="461" font-size="22" fill="#7ee7b4" font-weight="400">process_work(raw)</text>
<text xml:space="preserve" x="565" y="490" font-size="18" fill="#91a4b7" font-weight="400">  download -&gt; parse(work_id, pdf)</text>
<text xml:space="preserve" x="565" y="538" font-size="22" fill="#7ee7b4" font-weight="400">check_extraction(result)</text>
<text xml:space="preserve" x="565" y="567" font-size="18" fill="#91a4b7" font-weight="400">  page coverage / files / warnings</text>
<text xml:space="preserve" x="565" y="615" font-size="22" fill="#7ee7b4" font-weight="400">commit extraction run</text>
<text xml:space="preserve" x="565" y="644" font-size="18" fill="#91a4b7" font-weight="400">  rename -&gt; record_extraction()</text>
<text xml:space="preserve" x="565" y="675" font-size="18" fill="#91a4b7" font-weight="400">  _publish() -&gt; current.json</text>
<rect x="1140" y="300" width="500" height="400" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M1140 348 H1640" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="1160" y="331" font-size="19" fill="#79b8ff" font-weight="600">spawn :: _parser_worker()</text>
<text xml:space="preserve" x="1162" y="384" font-size="21" fill="#7ee7b4" font-weight="400">parse_pdf(pdf, out, options)</text>
<text xml:space="preserve" x="1162" y="425" font-size="18" fill="#d1d9e0" font-weight="400">1  PyMuPDF     raw pages / geometry</text>
<text xml:space="preserve" x="1162" y="460" font-size="18" fill="#d1d9e0" font-weight="400">2  OCRmyPDF*   selected-page text</text>
<text xml:space="preserve" x="1162" y="495" font-size="18" fill="#d1d9e0" font-weight="400">3  pdfplumber  table / text checks</text>
<text xml:space="preserve" x="1162" y="530" font-size="18" fill="#d1d9e0" font-weight="400">4  Docling     layout / structure</text>
<text xml:space="preserve" x="1162" y="565" font-size="18" fill="#d1d9e0" font-weight="400">5  GROBID*     references / TEI</text>
<path d="M1162 591 L1618 591" fill="none" stroke="#79b8ff" stroke-width="2"/>
<text xml:space="preserve" x="1162" y="628" font-size="19" fill="#91a4b7" font-weight="400">workers=1   timeout=600s</text>
<text xml:space="preserve" x="1162" y="665" font-size="19" fill="#91a4b7" font-weight="400">worker RSS budget: 3072 MiB</text>
<path d="M502 385 L537 385" fill="none" stroke="#79b8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="506" y="369" font-size="12" fill="#91a4b7" font-weight="400">JSON</text>
<path d="M538 593 L502 593" fill="none" stroke="#79b8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="506" y="577" font-size="12" fill="#91a4b7" font-weight="400">call</text>
<path d="M1102 473 L1137 473" fill="none" stroke="#79b8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="1107" y="456" font-size="12" fill="#91a4b7" font-weight="400">PDF</text>
<path d="M1138 550 L1102 550" fill="none" stroke="#79b8ff" stroke-width="2" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="1104" y="534" font-size="12" fill="#91a4b7" font-weight="400">dict</text>
<path d="M270 702 L270 798" fill="none" stroke="#79b8ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="285" y="753" font-size="15" fill="#91a4b7" font-weight="400">receipts / reservations</text>
<path d="M820 702 L820 798" fill="none" stroke="#79b8ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="835" y="753" font-size="15" fill="#91a4b7" font-weight="400">transactions / selection</text>
<path d="M1390 702 L1390 798" fill="none" stroke="#79b8ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="1405" y="753" font-size="15" fill="#91a4b7" font-weight="400">parser output to staging</text>
<rect x="40" y="800" width="460" height="220" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M40 848 H500" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="60" y="831" font-size="19" fill="#79b8ff" font-weight="600">disk :: request state</text>
<text xml:space="preserve" x="62" y="886" font-size="19" fill="#d1d9e0" font-weight="400">crawls/&lt;run&gt;/pages/*.json</text>
<text xml:space="preserve" x="62" y="921" font-size="19" fill="#d1d9e0" font-weight="400">*.receipt.json</text>
<text xml:space="preserve" x="62" y="956" font-size="19" fill="#d1d9e0" font-weight="400">state/network_budget.json</text>
<text xml:space="preserve" x="62" y="994" font-size="16" fill="#91a4b7" font-weight="400">checkpoint cursor + offset: SQLite</text>
<rect x="540" y="800" width="560" height="220" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M540 848 H1100" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="560" y="831" font-size="19" fill="#79b8ff" font-weight="600">SQLite + publication pointer</text>
<text xml:space="preserve" x="565" y="886" font-size="19" fill="#d1d9e0" font-weight="400">works / metadata_revisions</text>
<text xml:space="preserve" x="565" y="921" font-size="19" fill="#d1d9e0" font-weight="400">crawl_checkpoints / retry_queue</text>
<text xml:space="preserve" x="565" y="956" font-size="19" fill="#d1d9e0" font-weight="400">extraction_runs / validation_results</text>
<text xml:space="preserve" x="565" y="994" font-size="18" fill="#7ee7b4" font-weight="400">current.json -&gt; extractions/&lt;run&gt;</text>
<rect x="1140" y="800" width="500" height="220" rx="3" fill="#101b26" stroke="#344657"/>
<path d="M1140 848 H1640" stroke="#344657" stroke-width="1"/>
<text xml:space="preserve" x="1160" y="831" font-size="19" fill="#79b8ff" font-weight="600">disk :: paper artifacts</text>
<text xml:space="preserve" x="1162" y="886" font-size="19" fill="#d1d9e0" font-weight="400">metadata_history/&lt;sha&gt;.json</text>
<text xml:space="preserve" x="1162" y="921" font-size="19" fill="#d1d9e0" font-weight="400">original.pdf / pdf_versions/</text>
<text xml:space="preserve" x="1162" y="956" font-size="19" fill="#d1d9e0" font-weight="400">extractions/&lt;run&gt;/manifest.json</text>
<text xml:space="preserve" x="1162" y="994" font-size="18" fill="#91a4b7" font-weight="400">paper.md / tables / figures / ...</text>
<text xml:space="preserve" x="40" y="1061" font-size="18" fill="#91a4b7" font-weight="400">solid: calls / returned data     dashed: persistence     * configured only</text>
<text xml:space="preserve" x="40" y="1094" font-size="17" fill="#91a4b7" font-weight="400">Workers write staging output; pipeline.py commits runs. GROBID runs as a separate local service.</text>
</g>
</svg>
